<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RailRadar — Live Railway Tracking & Intelligence</title>
  <meta name="description" content="Every train. Every track. Real-time. Real-time Indian Railways tracking, weather integration, and 3D topographic profiles.">
  <meta name="theme-color" content="#090A0F">

  <!-- MapLibre GL CSS -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">

  <!-- RailRadar Design System & Styles -->
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/elevation-chart.css">
  <link rel="stylesheet" href="css/weather.css">
</head>
<body>

  <div id="app-container">
    <!-- Desktop Left Sidebar -->
    <nav id="sidebar">
      <div>
        <div class="brand-logo-container" title="RailRadar">
          <div class="brand-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2c-4 0-6 2-6 6v9c0 1.5 1 2 2 2h8c1 0 2-.5 2-2V8c0-4-2-6-6-6zm-4 4h8v3H8V6zm1 11a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm6 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3-4H6v-2h12v2z"/>
            </svg>
          </div>
        </div>

        <div class="nav-links">
          <!-- Live Map -->
          <button class="nav-item active tooltip-wrap" data-view="map" data-tooltip="Live Network Map">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/>
              <line x1="9" y1="3" x2="9" y2="18"/>
              <line x1="15" y1="6" x2="15" y2="21"/>
            </svg>
          </button>

          <!-- Journey Planner -->
          <button class="nav-item tooltip-wrap" data-view="journey" data-tooltip="Journey Planner">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <polygon points="12 6 12 12 16 14"/>
            </svg>
          </button>

          <!-- Favourites -->
          <button class="nav-item tooltip-wrap" data-view="favourites" data-tooltip="Saved Favourites">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
            <span id="fav-count-badge" class="nav-badge" style="display:none;">0</span>
          </button>

          <!-- Operator Console -->
          <button class="nav-item tooltip-wrap" data-view="dashboard" data-tooltip="Operator Console">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
              <line x1="8" y1="21" x2="16" y2="21"/>
              <line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="sidebar-bottom">
        <button id="btn-toggle-3d" class="nav-item tooltip-wrap" data-tooltip="Toggle 3D Terrain">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m8 3 4 8 5-5 5 15H2L8 3z"/>
          </svg>
        </button>
      </div>
    </nav>

    <!-- Main Viewport -->
    <main id="main-viewport">
      <!-- Top Floating Command Bar & Status -->
      <header class="floating-top-bar">
        <div id="search-command-container" class="search-command-container">
          <div class="search-command-input-wrap">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input
              type="text"
              class="search-command-input"
              placeholder="Search train (e.g. 22436, Rajdhani) or station..."
              autocomplete="off"
              spellcheck="false"
            />
            <span class="search-kbd-shortcut">/</span>
          </div>

          <!-- Dropdown Results -->
          <div class="search-results-dropdown"></div>
        </div>

        <div class="top-status-pill">
          <div class="pulse-indicator"></div>
          <span>Connecting Live GPS...</span>
        </div>
      </header>

      <!-- Floating Layer Controls (Top-Right) -->
      <div class="floating-layer-controls">
        <button id="btn-layer-controls" class="layer-toggle-btn" title="Map Layers & Styles">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"/>
            <polyline points="2 17 12 22 22 17"/>
            <polyline points="2 12 12 17 22 12"/>
          </svg>
        </button>

        <div id="layer-menu-popover" class="layer-menu-popover">
          <span class="layer-menu-section-title">Base Map Style</span>
          <div class="style-selector-grid">
            <div class="style-chip active" data-style="datavizDark">Dark Dataviz</div>
            <div class="style-chip" data-style="outdoor3D">3D Outdoor</div>
            <div class="style-chip" data-style="streetsDark">Streets Dark</div>
            <div class="style-chip" data-style="satelliteHybrid">Satellite</div>
          </div>

          <div style="height:1px; background:var(--border-subtle); margin:var(--space-2xs) 0;"></div>

          <span class="layer-menu-section-title">Overlays</span>
          <label class="layer-switch-row">
            <span>Live Express Trains</span>
            <input type="checkbox" id="toggle-train-layer" checked style="accent-color:var(--brand-cyan);" />
          </label>
          <label class="layer-switch-row">
            <span>Station Nodes</span>
            <input type="checkbox" id="toggle-station-layer" checked style="accent-color:var(--brand-cyan);" />
          </label>
          <label class="layer-switch-row">
            <span>Atmospheric Weather</span>
            <input type="checkbox" id="toggle-weather-layer" style="accent-color:var(--brand-cyan);" />
          </label>
        </div>
      </div>

      <!-- Map Canvas -->
      <div id="map"></div>

      <!-- Map Bottom Controls -->
      <div class="map-bottom-controls">
        <button id="btn-map-zoom-in" class="map-control-btn" title="Zoom In">+</button>
        <button id="btn-map-zoom-out" class="map-control-btn" title="Zoom Out">−</button>
        <button id="btn-map-reset" class="map-control-btn" title="Reset View">⤢</button>
      </div>

      <!-- Train Detail Drawer -->
      <aside id="train-detail-drawer" class="detail-drawer" aria-label="Train Detail Panel"></aside>

      <!-- Station Detail Drawer -->
      <aside id="station-detail-drawer" class="detail-drawer" aria-label="Station Detail Panel"></aside>

      <!-- Full Screen Views -->
      <section id="journey-planner-screen" class="full-screen-view" aria-label="Journey Planner Screen"></section>
      <section id="favourites-screen" class="full-screen-view" aria-label="Saved Favourites Screen"></section>
      <section id="operator-dashboard-screen" class="full-screen-view" aria-label="Operator Operations Dashboard"></section>
    </main>

    <!-- Mobile Bottom Tab Bar -->
    <nav class="mobile-tab-bar">
      <button class="nav-item active" data-view="map">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/></svg>
      </button>
      <button class="nav-item" data-view="journey">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="12 6 12 12 16 14"/></svg>
      </button>
      <button class="nav-item" data-view="favourites">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      </button>
      <button class="nav-item" data-view="dashboard">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/></svg>
      </button>
    </nav>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- MapLibre GL JS -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <!-- RailRadar Main Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
